name: Build and Release Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build plugins
        shell: bash
        run: |
          set -e

          RELEASE_TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          RELEASE_BASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"

          PLUGINS_JSON="[]"

          for dir in */; do
            dir="${dir%/}"
            plugin_file="${dir}/plugin.json"
            dist_dir="${dir}/dist-plugin"

            if [ ! -f "$plugin_file" ]; then
              echo "跳过 $dir: 没有 plugin.json"
              continue
            fi
            if [ ! -d "$dist_dir" ]; then
              echo "跳过 $dir: 没有 dist-plugin 目录"
              continue
            fi

            echo "处理插件: $dir"
            PLUGIN_ID=$(jq -r '.id' "$plugin_file")
            PLUGIN_VERSION=$(jq -r '.version' "$plugin_file")
            echo "  ID: $PLUGIN_ID | Version: $PLUGIN_VERSION"

            ZIP_NAME="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
            ZIP_PATH="${dir}/${ZIP_NAME}"

            (cd "$dir" && zip -r "$ZIP_NAME" "dist-plugin/" -x "*.git*" > /dev/null 2>&1)

            SHA256_VALUE=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
            SIZE_BYTES=$(stat -c%s "$ZIP_PATH")

            DOWNLOAD_URL="${RELEASE_BASE_URL}/${ZIP_NAME}"
            DOWNLOAD_SOURCE=$(jq -n \
              --arg url "$DOWNLOAD_URL" \
              --arg tag "$RELEASE_TAG" \
              '{type: "github-release", url: $url, tag: $tag}')

            jq --arg sha256 "$SHA256_VALUE" \
               --argjson size $SIZE_BYTES \
               --argjson source "$DOWNLOAD_SOURCE" \
               '.sha256 = $sha256 | .sizeBytes = $size | .downloadSources = [$source]' \
               "$plugin_file" > "${plugin_file}.tmp" && mv "${plugin_file}.tmp" "$plugin_file"

            PLUGIN_META=$(jq -c \
              --arg downloadUrl "$DOWNLOAD_URL" \
              --arg zipName "$ZIP_NAME" \
              '. + {downloadUrl: $downloadUrl, zipName: $zipName}' \
              "$plugin_file")
            PLUGINS_JSON=$(echo "$PLUGINS_JSON" | jq --argjson meta "$PLUGIN_META" '. + [$meta]')
          done

          # 生成汇总文件 plugins-index.json
          echo "$PLUGINS_JSON" > plugins-index.json
          echo "汇总文件已生成: plugins-index.json"

          # 生成 Release body
          {
            echo "## Plugins Release ${RELEASE_TAG}"
            echo ""
            echo "| id | name | version | size | sha256 |"
            echo "|---|------|---------|------|--------|"
            echo "$PLUGINS_JSON" | jq -r '.[] | [.id, .name, .version, .sizeBytes, .sha256[0:16]] | @tsv' | \
              while IFS=$'\t' read -r id name ver size sha; do
                echo "| $id | $name | $ver | ${size} bytes | \`${sha}...\` |"
              done
            echo ""
            echo "---"
            echo "Download: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          } > release_body.md
          echo "Release body 已生成"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Plugins Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            plugins-index.json
            **/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push plugins index to data branch
        shell: bash
        run: |
          BRANCH_NAME="plugins-data"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 备份汇总文件
          cp plugins-index.json /tmp/plugins-index.json

          # 创建孤立分支（与所有历史无关），只包含一个 plugins-index.json
          git checkout --orphan "${BRANCH_NAME}"
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/plugins-index.json .
          git add plugins-index.json
          git commit -m "Update plugins index for ${{ env.RELEASE_TAG }}"

          # --force 覆盖远程分支（无论是否存在）
          git push origin "${BRANCH_NAME}" --force
          echo "✅ 汇总文件已推送到分支: ${BRANCH_NAME}"
        shell: bash
        run: |
          BRANCH_NAME="plugins-data"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp plugins-index.json /tmp/plugins-index.json

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH_NAME}" > /dev/null 2>&1; then
            git fetch origin "${BRANCH_NAME}"
            git checkout "${BRANCH_NAME}"
          else
            git checkout --orphan "${BRANCH_NAME}"
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/plugins-index.json .
          git add plugins-index.json
          if git commit -m "Update plugins index for ${{ env.RELEASE_TAG }}"; then
            git push origin "${BRANCH_NAME}"
            echo "汇总文件已推送到分支: ${BRANCH_NAME}"
          else
            echo "没有变更需要提交"
          fi