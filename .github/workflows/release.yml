name: Build and Release Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Fetch previous plugins index
        shell: bash
        run: |
          if git ls-remote --exit-code origin plugins-data 2>/dev/null; then
            git fetch origin plugins-data --depth=1
            git show origin/plugins-data:plugins-index.json > /tmp/old-plugins-index.json 2>/dev/null || echo "[]" > /tmp/old-plugins-index.json
          else
            echo "[]" > /tmp/old-plugins-index.json
          fi
          echo "✅ 已加载上次发布的 plugins-index"

      - name: Build plugins
        shell: bash
        run: |
          set -e

          RELEASE_TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          RELEASE_BASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"

          # 加载上次发布的索引
          OLD_INDEX=$(cat /tmp/old-plugins-index.json 2>/dev/null || echo "[]")

          # 创建存放有变动的 ZIP 的目录
          mkdir -p release-zips

          NEW_INDEX="[]"

          for dir in */; do
            dir="${dir%/}"
            [ "$dir" = "release-zips" ] && continue
            plugin_file="${dir}/plugin.json"
            dist_dir="${dir}/dist-plugin"

            if [ ! -f "$plugin_file" ]; then
              echo "跳过 $dir: 没有 plugin.json"
              continue
            fi
            if [ ! -d "$dist_dir" ]; then
              echo "跳过 $dir: 没有 dist-plugin 目录"
              continue
            fi

            echo "处理插件: $dir"
            PLUGIN_ID=$(jq -r '.id' "$plugin_file")
            PLUGIN_VERSION=$(jq -r '.version' "$plugin_file")
            echo "  ID: $PLUGIN_ID | Version: $PLUGIN_VERSION"

            ZIP_NAME="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
            ZIP_PATH="${dir}/${ZIP_NAME}"

            # 构建 ZIP（统一 mtime，排除 extra attributes）
            (cd "$dir" && find "dist-plugin/" -exec touch -t 202401010000 {} \; && zip -X -r "$ZIP_NAME" "dist-plugin/" -x "*.git*" > /dev/null 2>&1)

            SHA256_VALUE=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
            SIZE_BYTES=$(stat -c%s "$ZIP_PATH")

            # 与上次发布的索引比对哈希
            PLUGIN_KEY="${PLUGIN_ID}-${PLUGIN_VERSION}"
            OLD_ENTRY=$(echo "$OLD_INDEX" | jq -c --arg id "$PLUGIN_KEY" '.[] | select(.id == $id)')
            OLD_SHA=$(echo "$OLD_ENTRY" | jq -r '.sha256 // empty')

            if [ -n "$OLD_SHA" ] && [ "$OLD_SHA" = "$SHA256_VALUE" ]; then
              echo "  ⏭️ 哈希未变，跳过发布（复用上次的下载地址）"
              NEW_INDEX=$(echo "$NEW_INDEX" | jq --argjson entry "$OLD_ENTRY" '. + [$entry]')
            else
              echo "  哈希变化或新插件，准备发布"

              PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              DOWNLOAD_URL="${RELEASE_BASE_URL}/${ZIP_NAME}"
              PROXY_DOWNLOAD_URL="https://gh-proxy.com/${DOWNLOAD_URL}"

              # 更新 plugin.json:
              # 1) sha256 / sizeBytes
              # 2) downloadSources: 更新 GitHub 源，追加 Github Proxy 源
              jq --arg sha256 "$SHA256_VALUE" \
                 --argjson size $SIZE_BYTES \
                 --arg url "$DOWNLOAD_URL" \
                 --arg proxy_url "$PROXY_DOWNLOAD_URL" \
                 --arg published_at "$PUBLISHED_AT" \
                '(.downloadSources | map(.label) | index("GitHub")) as $github_idx |
                 (.downloadSources | map(.label) | index("Github Proxy")) as $proxy_idx |
                 (if $github_idx then .downloadSources[$github_idx].url = $url
                  else .downloadSources += [{"label": "GitHub", "url": $url, "priority": 1}]
                  end) |
                 (if $proxy_idx then .downloadSources[$proxy_idx].url = $proxy_url
                  else .downloadSources += [{"label": "Github Proxy", "url": $proxy_url, "priority": 2}]
                  end) |
                 .sha256 = $sha256 | .sizeBytes = $size | .publishedAt = $published_at' \
                 "$plugin_file" > "${plugin_file}.tmp" && mv "${plugin_file}.tmp" "$plugin_file"

              # 收集元数据
              PLUGIN_META=$(jq -c '{id: (.id + "-" + .version), name, version, description, extensions, urlTemplate, sha256, sizeBytes, archiveFormat, publishedAt, downloadSources}' "$plugin_file")
              NEW_INDEX=$(echo "$NEW_INDEX" | jq --argjson meta "$PLUGIN_META" '. + [$meta]')

              # 将 ZIP 复制到待发布目录
              cp "$ZIP_PATH" "release-zips/"
            fi
          done

          # 合并: 保留仅存在于上次索引中的条目（版本变化/已移除插件）,id 为新索引缺失的旧条目
          NEW_INDEX=$(echo "$NEW_INDEX" | jq --argjson old "$OLD_INDEX" '
            . as $new | $new + [ $old[] | select(.id as $oid | ($new | map(.id) | index($oid)) == null) ]')

          # 生成新的汇总文件 plugins-index.json
          echo "$NEW_INDEX" > plugins-index.json
          echo "汇总文件已生成: plugins-index.json（未变动的插件沿用上次的下载地址）"

          # 生成 Release body
          {
            echo "## Plugins Release ${RELEASE_TAG}"
            echo ""
            echo "| id | name | version | size | sha256 |"
            echo "|---|------|---------|------|--------|"
            echo "$NEW_INDEX" | jq -r '.[] | [.id, .name, .version, .sizeBytes, .sha256[0:16]] | @tsv' | \
              awk 'BEGIN {FS="\t"} {printf "| %s | %s | %s | %s bytes | `%s...` |\n", $1, $2, $3, $4, $5}'
            echo ""
            echo "---"
            echo "Download: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          } > release_body.md
          echo "Release body 已生成"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Plugins Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: release-zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push plugins index to data branch
        shell: bash
        run: |
          BRANCH_NAME="plugins-data"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 备份汇总文件
          cp plugins-index.json /tmp/plugins-index.json

          # 创建孤立分支（与所有历史无关），只包含一个 plugins-index.json
          git checkout --orphan "${BRANCH_NAME}"
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/plugins-index.json .
          git add plugins-index.json
          git commit -m "Update plugins index for ${{ env.RELEASE_TAG }}"

          # --force 覆盖远程分支（无论是否存在）
          git push origin "${BRANCH_NAME}" --force
          echo "✅ 汇总文件已推送到分支: ${BRANCH_NAME}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release-zips/*.zip
            release_body.md
          if-no-files-found: error

  sync-to-gitee:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-zips

      - name: Mirror code to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          GITEE_REPO="https://gitee.com/wangwangqin523/openvue-plugins.git"

          git config user.name "wangwangqin523"
          git config user.email "wangwangqin523@gitee.com"

          # 使用 credential 方式避免 token 出现在 remote URL 的 git log 中
          git remote add gitee "$GITEE_REPO"
          git config credential.helper "store --file=/tmp/gitee-creds"
          echo "https://wangwangqin523:${GITEE_TOKEN}@gitee.com" > /tmp/gitee-creds
          chmod 600 /tmp/gitee-creds

          # 确保所有分支都在本地 refs/heads/ 下（checkout 默认只拉当前 ref）
          git fetch origin --no-tags "+refs/heads/*:refs/heads/*"

          # 仅推送本地分支 (refs/heads) 和标签 (refs/tags)
          # 不推送 refs/remotes/*（远端跟踪引用），避免被当作远程分支名
          git push gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          echo "✅ 代码已镜像同步到 Gitee"

      - name: Sync all GitHub releases to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          GITEE_OWNER="wangwangqin523"
          GITEE_REPO="openvue-plugins"
          GITEE_API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          GH_OWNER="${GITHUB_REPOSITORY%%/*}"
          GH_REPO="${GITHUB_REPOSITORY##*/}"
          GH_API="https://api.github.com/repos/${GH_OWNER}/${GH_REPO}"

          TMP_DIR=$(mktemp -d)
          trap "rm -rf $TMP_DIR" EXIT

          # ========== 1. 拉取 GitHub 所有 releases ==========
          echo "🔍 拉取 GitHub releases..."
          GH_RELEASES=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${GH_API}/releases?per_page=100")
          HTTP_CODE=$(echo "$GH_RELEASES" | tail -n1)
          GH_RELEASES=$(echo "$GH_RELEASES" | sed '$d')
          echo "  GitHub API HTTP: $HTTP_CODE"

          TOTAL=$(echo "$GH_RELEASES" | jq 'length')
          echo "📦 GitHub 共有 ${TOTAL} 个 release"

          # ========== 2. 逐个同步（用 process substitution 避免 subshell 吞错误） ==========
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue

            TAG=$(echo "$rel" | jq -r '.tag_name')
            NAME=$(echo "$rel" | jq -r '.name // "Release ${TAG}"')
            BODY=$(echo "$rel" | jq -r '.body // ""')
            DRAFT=$(echo "$rel" | jq -r '.draft')
            PRERELEASE=$(echo "$rel" | jq -r '.prerelease')
            ASSETS=$(echo "$rel" | jq -c '.assets // []')

            if [ "$DRAFT" = "true" ] || [ "$PRERELEASE" = "true" ]; then
              echo "⏭️  跳过 ${TAG} (draft/prerelease)"
              continue
            fi

            # 检查 Gitee 是否已存在
            # 注意：Gitee API 的 ?tag_name 参数不生效（忽略过滤），
            # 必须拉全量后在本地用 jq 精确匹配 tag_name
            EXISTING=$(curl -s "${GITEE_API}/releases?access_token=${GITEE_TOKEN}&per_page=100")
            RELEASE_ID=$(echo "$EXISTING" | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .id' | head -n1)

            if [ -n "$RELEASE_ID" ]; then
              echo "⏭️  ${TAG} 已存在于 Gitee (id=${RELEASE_ID})"
              continue
            fi

            echo "🆕 同步 ${TAG} ..."

            # 拿 commit SHA —— 加 ^{commit} 确保 annotated tag 也能拿到 commit
            TARGET_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || echo "")
            if [ -z "$TARGET_SHA" ]; then
              echo "  本地没找到 tag，从 GitHub API 拿 SHA..."
              TAG_INFO=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "${GH_API}/git/refs/tags/${TAG}")
              TARGET_SHA=$(echo "$TAG_INFO" | jq -r '.object.sha // .commit.sha // empty')
            fi
            if [ -z "$TARGET_SHA" ]; then
              echo "  ❌ 无法获取 ${TAG} 的 commit SHA"
              continue
            fi
            echo "  target SHA: ${TARGET_SHA}"

            # 创建 Gitee Release
            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --arg name "$NAME" \
              --arg body "$BODY" \
              --arg target "$TARGET_SHA" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')

            CREATE_RAW=$(curl -s -w '\n%{http_code}' -X POST "${GITEE_API}/releases?access_token=${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            CREATE_CODE=$(echo "$CREATE_RAW" | tail -n1)
            CREATE_RESP=$(echo "$CREATE_RAW" | sed '$d')
            echo "  Gitee 创建响应 (HTTP ${CREATE_CODE}): ${CREATE_RESP:0:200}"

            RELEASE_ID=$(echo "$CREATE_RESP" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "  ❌ 创建 Release 失败"
              continue
            fi
            echo "  ✅ Release id=${RELEASE_ID}"

            # 下载 GitHub 附件并上传
            ASSET_COUNT=$(echo "$ASSETS" | jq 'length')
            for i in $(seq 0 $((ASSET_COUNT - 1))); do
              ASSET_URL=$(echo "$ASSETS" | jq -r ".assets[${i}].browser_download_url")
              ASSET_NAME=$(echo "$ASSETS" | jq -r ".assets[${i}].name")
              echo "  ↓ 下载 ${ASSET_NAME}"

              curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -o "${TMP_DIR}/${ASSET_NAME}" "$ASSET_URL"

              echo "  ↑ 上传 ${ASSET_NAME}"
              curl -s -X POST "${GITEE_API}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${TMP_DIR}/${ASSET_NAME}" \
                -F "name=${ASSET_NAME}" > /dev/null
            done
            echo "  ✅ ${TAG} 完成"

          done < <(echo "$GH_RELEASES" | jq -c '.[]')

          echo "✅ 所有 release 同步完成"